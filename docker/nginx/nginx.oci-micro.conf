# ==============================================================================
# CM TECHMAP — OCI Micro Nginx Configuration (backend-only stack)
# Used by docker-compose.oci-micro.yml via Dockerfile.oci-micro.
# No frontend/titiler/martin/flower/grafana upstreams — those services do not
# exist in the micro stack; referencing them would abort nginx at startup.
# ==============================================================================

worker_processes auto;
worker_rlimit_nofile 4096;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 500m;
    server_tokens off;

    # --- Rate limiting (this is the only public entrypoint of the VM) ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=tile_limit:10m rate=100r/s;
    limit_req_status 429;

    # --- Gzip ---
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1000;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker embedded DNS — lets optional upstreams resolve lazily
    resolver 127.0.0.11 valid=30s ipv6=off;

    # === HTTP Server (port 80) ===
    server {
        listen 80;
        server_name _;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # --- Uploads / asset ingestion (long-running) ---
        # A 23 MB GeoTIFF takes ~240 s to convert to COG on this 1 GB VM; the
        # generic 120 s timeout returned 504 to the client while the backend
        # kept working and completed successfully. Must come BEFORE /api/.
        location ~ ^/api/v1/(assets|uploads)/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 2g;
        }

        # --- Login (brute-force protection: strictest zone) ---
        location = /api/v1/auth/login {
            limit_req zone=auth_limit burst=10 nodelay;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # --- Map tiles (bursty by nature: panning fires dozens of requests) ---
        location /api/v1/tiles/ {
            limit_req zone=tile_limit burst=300 nodelay;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # --- API Backend ---
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # --- HTTP polling fallback for processing progress ---
        location /processing/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- WebSocket (processing progress) ---
        location /ws/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        # --- OpenAPI Docs: NOT exposed in production ---
        # Swagger/ReDoc/openapi.json enumerate the whole API surface to
        # anonymous visitors. Access them via SSH tunnel when needed:
        #   ssh -L 8000:127.0.0.1:8000 ubuntu@<vm> → http://localhost:8000/docs
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        # --- Keycloak OIDC (Keycloak 17+ serves at the root path) ---
        location /realms/ {
            set $keycloak_upstream http://keycloak:8080;
            proxy_pass $keycloak_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        location /resources/ {
            set $keycloak_upstream http://keycloak:8080;
            proxy_pass $keycloak_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1h;
        }

        # --- MinIO Console: NOT exposed in production ---
        # The storage console must never face the internet. Reach it via
        # SSH tunnel: ssh -L 19001:127.0.0.1:19001 ubuntu@<vm>
        location /minio/ {
            return 404;
        }

        # --- Default: service info ---
        location / {
            default_type application/json;
            return 200 '{"service":"cm-techmap","status":"running","endpoints":{"/api/v1/health":"API Health","/docs":"Swagger UI","/redoc":"ReDoc"}}';
        }
    }
}
