# ==============================================================================
# CM TECHMAP — Gateway da instalação LOCAL
# ==============================================================================
# Único ponto exposto no host. Faz a plataforma inteira responder sob UM
# domínio (http://cmtechmap.local), como se fosse um serviço na internet:
#
#   /                → frontend  (SPA compilada)
#   /api/            → backend   (FastAPI)
#   /realms/         → keycloak  (OIDC — Keycloak 17+ serve na RAIZ, sem /auth)
#   /resources/      → keycloak  (CSS/JS das telas de login)
#   /ws/             → backend   (WebSocket de progresso)
#   /processing/     → backend   (fallback por polling quando o WS cai)
#
# `/auth/callback` NÃO tem proxy: é rota da SPA (troca do authorization code).
# Mandá-la ao Keycloak faria o app nunca receber o código.
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2g;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/json application/javascript application/xml
               application/vnd.mapbox-vector-tile application/x-protobuf
               text/css text/plain text/xml text/javascript image/svg+xml;

    # DNS interno do Docker: permite que os upstreams resolvam de forma
    # preguiçosa. Com proxy_pass literal o nginx resolve no boot e ABORTA se
    # um serviço ainda não subiu — aqui ele apenas tenta de novo.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        # ── Cabeçalhos de segurança ───────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Saúde do próprio gateway ──────────────────────────────────────
        location = /gateway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # ── Upload / ingestão de assets (conversão COG é demorada) ────────
        # Precisa vir ANTES de /api/ para ter precedência.
        location ~ ^/api/v1/(assets|uploads)/ {
            set $backend_up http://backend:8000;
            proxy_pass $backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 2g;
        }

        # ── API ───────────────────────────────────────────────────────────
        location /api/ {
            set $backend_up http://backend:8000;
            proxy_pass $backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # ── Documentação da API (útil numa instalação local) ──────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            set $backend_up http://backend:8000;
            proxy_pass $backend_up;
            proxy_set_header Host $host;
        }

        # ── WebSocket de progresso ────────────────────────────────────────
        location /ws/ {
            set $backend_up http://backend:8000;
            proxy_pass $backend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Fallback por polling quando o WebSocket não conecta ───────────
        location /processing/ {
            set $backend_up http://backend:8000;
            proxy_pass $backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Keycloak (OIDC) — serve na RAIZ na versão 17+, sem /auth ──────
        location /realms/ {
            set $kc_up http://keycloak:8080;
            proxy_pass $kc_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        location /resources/ {
            set $kc_up http://keycloak:8080;
            proxy_pass $kc_up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1h;
        }

        # ── Console administrativo do Keycloak ────────────────────────────
        # Numa instalação local o operador É o dono da máquina; manter
        # acessível evita ter que descobrir portas internas.
        # ATENÇÃO: o SPA também usa /admin/* (portal do super_admin —
        # /admin/tenants, /admin/error-logs...). Proxiar /admin/ inteiro
        # para o Keycloak quebrava qualquer link direto do portal (405 da
        # página de erro do KC). Só os caminhos que o console REALMENTE usa
        # vão para o Keycloak; o resto cai no catch-all do React.
        location ^~ /admin/master/ {
            set $kc_up http://keycloak:8080;
            proxy_pass $kc_up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
        location ^~ /admin/realms/ {
            set $kc_up http://keycloak:8080;
            proxy_pass $kc_up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
        location ^~ /admin/serverinfo {
            set $kc_up http://keycloak:8080;
            proxy_pass $kc_up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ── SPA (catch-all) ───────────────────────────────────────────────
        # Precisa ser a ÚLTIMA regra: qualquer caminho não capturado acima é
        # rota do React (incluindo /auth/callback).
        location / {
            set $front_up http://frontend:3000;
            proxy_pass $front_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
