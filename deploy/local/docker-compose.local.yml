# ==============================================================================
# CM TECHMAP — Stack LOCAL COMPLETA (instalação on-premise)
# ==============================================================================
# Roda a plataforma inteira na máquina do usuário, servida por um domínio
# próprio (padrão: http://cmtechmap.local) em vez de localhost.
#
# ISOLAMENTO — este arquivo NÃO compartilha nada com os outros ambientes:
#   • project name  cm-techmap-local  (containers com prefixo cml-)
#   • volumes       cml-*             (dados separados do stack de dev)
#   • rede          cm-local-network
#   • porta         apenas ${CM_HTTP_PORT} no host — o resto é interno
# Trocar/derrubar este stack não afeta a produção na Oracle nem o compose de
# desenvolvimento (docker-compose.yml), que usa prefixo cm- e portas 1xxxx.
#
# DIFERENÇA para a produção OCI: aqui há RAM suficiente para o NodeODM, então
# a fotogrametria roda de verdade (ALLOW_SIMULATION continua desligado — o
# pipeline nunca inventa resultado).
# ==============================================================================

name: cm-techmap-local

x-logging: &cml-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL + PostGIS
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.5
    container_name: cml-postgres
    restart: unless-stopped
    logging: *cml-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cm_techmap}
      POSTGRES_USER: ${POSTGRES_USER:-cm_techmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_MULTIPLE_DATABASES: ${KC_POSTGRES_DB:-keycloak}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=128MB
        -c work_mem=8MB
        -c max_connections=100
        -c log_min_duration_statement=5000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cm_techmap} -d ${POSTGRES_DB:-cm_techmap}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  # Redis — broker do Celery + cache
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cml-redis
    restart: unless-stopped
    logging: *cml-logging
    # noeviction: o Redis é o broker do Celery. Com política de despejo, uma
    # tarefa enfileirada pode ser descartada em silêncio ao encher a memória.
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # MinIO — armazenamento de objetos (ortomosaicos, DSM, relatórios)
  # ────────────────────────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: cml-minio
    restart: unless-stopped
    logging: *cml-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cm_techmap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatorio}
      MINIO_BROWSER_REDIRECT_URL: http://${CM_DOMAIN:-cmtechmap.local}/minio-console/
    volumes:
      - minio_data:/data
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: cml-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cm_techmap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../../docker/minio/init-buckets.sh:/init-buckets.sh:ro
    networks: [cm-local-network]
    restart: "no"

  # ────────────────────────────────────────────────────────────────────────────
  # Keycloak — autenticação
  #
  # KC_HOSTNAME precisa ser a URL que o NAVEGADOR usa: o Keycloak deriva o
  # `iss` dos tokens dela. Se ficar em localhost, todo token emitido pelo
  # domínio local é rejeitado pelo backend com "Invalid token issuer".
  # ────────────────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: cml-keycloak
    # tini como PID 1 recolhe os órfãos do probe de saúde (o java não faz reap)
    init: true
    restart: unless-stopped
    logging: *cml-logging
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-cmadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD obrigatorio}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-cm_techmap}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: http://${CM_DOMAIN:-cmtechmap.local}${CM_PORT_SUFFIX:-}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ../../docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": *\"UP\"' <&3"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 120s

  # ────────────────────────────────────────────────────────────────────────────
  # Backend — FastAPI
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../../cm-techmap-backend
      dockerfile: Dockerfile
    image: cm-techmap-local-backend
    container_name: cml-backend
    restart: unless-stopped
    logging: *cml-logging
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers ${API_WORKERS:-2}
        --timeout-keep-alive 30
        --log-level ${API_LOG_LEVEL:-info}
    environment:
      # Instalação local NÃO é "production": o guard de segredo placeholder
      # aborta o boot em produção, e /docs é útil aqui.
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY:?APP_SECRET_KEY obrigatorio}
      - APP_CORS_ORIGINS=http://${CM_DOMAIN:-cmtechmap.local}${CM_PORT_SUFFIX:-}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
      - DATABASE_URL_DIRECT=postgresql+asyncpg://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=5
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-cm_techmap}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=false
      # O backend fala com o Keycloak pela rede interna, mas os tokens que
      # chegam do navegador carregam o domínio local como emissor — os dois
      # precisam estar na lista de emissores aceitos.
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_EXTERNAL_URL=http://${CM_DOMAIN:-cmtechmap.local}${CM_PORT_SUFFIX:-}
      - KEYCLOAK_EXTRA_ISSUERS=${KEYCLOAK_EXTRA_ISSUERS:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-cm-techmap}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-cm-techmap-api}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_TIMEOUT=${KEYCLOAK_TIMEOUT:-30}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-cmadmin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - TITILER_URL=http://titiler:80
      - MARTIN_URL=http://martin:3000
      # NodeODM presente => fotogrametria REAL. ALLOW_SIMULATION segue
      # desligado: sem o motor, o pipeline falha em vez de fingir sucesso.
      - NODEODM_HOST=nodeodm
      - NODEODM_PORT=3000
      - GROQ_ENABLED=${GROQ_ENABLED:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ../../cm-techmap-backend/alembic:/app/alembic:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ────────────────────────────────────────────────────────────────────────────
  # Celery Worker — processamento assíncrono
  # ────────────────────────────────────────────────────────────────────────────
  celery-worker:
    image: cm-techmap-local-backend
    container_name: cml-celery-worker
    restart: unless-stopped
    logging: *cml-logging
    command: >
      celery -A app.celery_app worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-2}
        --queues=default,processing,reports,ai_llm
        --max-tasks-per-child=50
        --prefetch-multiplier=1
        -O fair
        -n worker@%h
    environment:
      - APP_ENV=staging
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
      - DATABASE_URL_DIRECT=postgresql+asyncpg://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-cm_techmap}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=false
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-cm-techmap}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-cm-techmap-api}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - TITILER_URL=http://titiler:80
      - MARTIN_URL=http://martin:3000
      - NODEODM_HOST=nodeodm
      - NODEODM_PORT=3000
      - GROQ_ENABLED=${GROQ_ENABLED:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}
    networks: [cm-local-network]

  # ────────────────────────────────────────────────────────────────────────────
  # Celery Beat — agendador (backups, limpezas, health-check de tenants)
  # ────────────────────────────────────────────────────────────────────────────
  celery-beat:
    image: cm-techmap-local-backend
    container_name: cml-celery-beat
    restart: unless-stopped
    logging: *cml-logging
    command: >
      celery -A app.celery_app beat
        --loglevel=info
        --schedule=/tmp/celerybeat-schedule
    environment:
      - APP_ENV=staging
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis: {condition: service_healthy}
    networks: [cm-local-network]

  # ────────────────────────────────────────────────────────────────────────────
  # TiTiler — tiles raster (ortomosaicos COG)
  # ────────────────────────────────────────────────────────────────────────────
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: cml-titiler
    restart: unless-stopped
    logging: *cml-logging
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-cm_techmap}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_ENDPOINT=minio:9000
      - AWS_VIRTUAL_HOSTING=FALSE
      - AWS_HTTPS=NO
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - WEB_CONCURRENCY=2
    depends_on:
      minio: {condition: service_healthy}
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  # Martin — tiles vetoriais (PostGIS)
  # ────────────────────────────────────────────────────────────────────────────
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: cml-martin
    restart: unless-stopped
    logging: *cml-logging
    command: --listen-addresses 0.0.0.0:3000
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cm_techmap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cm_techmap}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────────────────────────────
  # NodeODM — motor de fotogrametria REAL
  # Não cabe na VM de 1 GB da Oracle; aqui roda de verdade.
  # ────────────────────────────────────────────────────────────────────────────
  nodeodm:
    image: opendronemap/nodeodm:latest
    container_name: cml-nodeodm
    restart: unless-stopped
    logging: *cml-logging
    volumes:
      - nodeodm_data:/var/www/data
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    shm_size: '512m'
    deploy:
      resources:
        limits:
          memory: ${NODEODM_MEMORY_LIMIT:-8G}

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend — SPA compilada (servida pelo gateway)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../cm-techmap-frontend
      dockerfile: Dockerfile
      args:
        # Vazio = caminhos relativos: o navegador chama o MESMO domínio e o
        # gateway roteia. Assim nada no bundle aponta para localhost.
        VITE_API_URL: ""
    image: cm-techmap-local-frontend
    container_name: cml-frontend
    restart: unless-stopped
    logging: *cml-logging
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ────────────────────────────────────────────────────────────────────────────
  # Gateway — único ponto exposto no host
  # Serve a SPA e faz proxy de /api, /realms, /resources, /ws
  # ────────────────────────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: cml-gateway
    restart: unless-stopped
    logging: *cml-logging
    ports:
      - "${CM_BIND_ADDRESS:-0.0.0.0}:${CM_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend: {condition: service_started}
      frontend: {condition: service_started}
    networks: [cm-local-network]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/gateway-health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  cm-local-network:
    name: cm-local-network
    driver: bridge

volumes:
  postgres_data:
    name: cml-postgres-data
  redis_data:
    name: cml-redis-data
  minio_data:
    name: cml-minio-data
  nodeodm_data:
    name: cml-nodeodm-data
