# ==============================================================================
# CM TECHMAP — Horizontal Scaling Override
# docker compose -f docker-compose.prod.yml -f docker-compose.scale.yml up -d
# ==============================================================================
# This file overrides the production compose to enable horizontal scaling.
#
# NOTES:
# - `ports` is RESET on backend: the base file publishes 127.0.0.1:8000, and a
#   published host port can only be bound by ONE replica — without the reset,
#   replicas 2..N fail with "port is already allocated". Traffic reaches the
#   backends through the nginx upstream (Docker DNS round-robin).
# - Swarm-only keys (update_config/restart_policy) were removed: plain
#   `docker compose up` silently ignores them, which advertised zero-downtime
#   rolling updates that never actually happened.
# - celery-beat lives in docker-compose.prod.yml (exactly one instance).
# ==============================================================================

name: cm-techmap-prod

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend — Horizontal Replicas
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    container_name: ""  # Allow multiple replicas
    ports: !reset []    # Replicas cannot share a published host port
    deploy:
      replicas: ${BACKEND_REPLICAS:-4}
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ────────────────────────────────────────────────────────────────────────────
  # Celery Workers — Horizontal Replicas
  # ────────────────────────────────────────────────────────────────────────────
  celery-worker:
    container_name: ""
    deploy:
      replicas: ${CELERY_REPLICAS:-4}
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ────────────────────────────────────────────────────────────────────────────
  # Nginx — wait for at least one healthy backend replica
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    depends_on:
      backend:
        condition: service_healthy
