[project]
name = "cm-techmap-backend"
version = "0.1.0"
description = "CM TECHMAP — Smart Cities GovTech Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "FIREWARE Labs", email = "dev@fireware.com.br"},
]

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",

    # ── Database & ORM ─────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "geoalchemy2>=0.15.0",
    "alembic>=1.14.0",

    # ── Async Task Queue ───────────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "flower>=2.0.0",

    # ── Object Storage ─────────────────────────────────────────────────────
    "minio>=7.2.0",

    # ── Authentication & Security ──────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "groq>=0.11.0",

    # ── Geospatial Processing (Phase 2) ───────────────────────────────────
    "rasterio>=1.4.0",
    "rio-cogeo>=5.4.0",
    "pyproj>=3.7.0",
    "shapely>=2.0.0",

    # ── Image Analysis (DSM Generation + Building Extraction) ─────────────
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    # Pillow is imported directly (terrain tile re-encode, Groq vision tiling)
    "pillow>=10.0.0",
    # OpenCV powers morphological cleanup in pool detection
    "opencv-python-headless>=4.10.0",

    # ── Point Cloud Processing (Phase 4 — LAZ → Gaussian Splat) ──────────
    "laspy[lazrs]>=2.5.0",

    # ── 3D Model Processing (Phase 2 — OBJ → glTF/glb conversion) ────────
    "trimesh[easy]>=4.5.0",

    # ── WebSocket ──────────────────────────────────────────────────────────
    "websockets>=14.0",

    # ── Report Generation (Phase 4A) ──────────────────────────────────────
    "weasyprint>=62.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",

    # ── Utilities ──────────────────────────────────────────────────────────
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Report templates must ship with the package — without this a wheel/sdist
# install produces TemplateNotFound and silently degrades to placeholder PDFs.
app = ["templates/**/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = [
    "E501",
    # HTTPException re-raises inside except blocks are idiomatic FastAPI;
    # chaining (`from e`) is encouraged but not enforced repo-wide.
    "B904",
    # (str, Enum) → StrEnum changes str(member) semantics ("X.a" vs "a");
    # several enums are serialized/logged, so the rewrite is not safe.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls are intentionally evaluated in defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
    "fastapi.Body", "fastapi.Header", "fastapi.Path", "fastapi.Cookie",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Deliberate late imports: middleware/metrics after app creation, beat
# schedule after celery_app configuration.
"app/main.py" = ["E402"]
"app/celery_app.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
# NOTE: sqlalchemy.ext.mypy.plugin was removed in SQLAlchemy 2.x —
# SQLAlchemy 2.0 typing works natively with mypy.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
